# Actualizaciones de versión: solo las actions de GitHub (también las fijadas por SHA), una vez por
# semana y en un solo PR. Las dependencias de npm solo reciben las alertas y los PRs de seguridad,
# que se activan en Settings → Advanced Security (decisión de Agu del 18/11/2026).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
