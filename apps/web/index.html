<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EstudIA</title>
    <link rel="icon" href="/icons/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#fff7fb" id="themeColor" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EstudIA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Antes de pintar, para que el tema guardado no parpadee. Ver src/interfaz/tema.ts.
      try {
        if (localStorage.getItem("estudia.theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.getElementById("themeColor").setAttribute("content", "#130c13");
        }
      } catch (e) {}
    </script>
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin-standard-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
